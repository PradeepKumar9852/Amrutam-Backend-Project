version: '3.8'

services:
  # =========================================================================
  # 1. PostgreSQL Database Service
  # =========================================================================
  postgres:
    image: postgres:17-alpine
    container_name: amrutam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-amrutam_telemedicine}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-amrutam_telemedicine}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - amrutam-network

  # =========================================================================
  # 2. Redis In-Memory Cache & Token Blacklist Service
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: amrutam-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - amrutam-network

  # =========================================================================
  # 3. Amrutam Telemedicine Express Backend API
  # =========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amrutam-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      # Automatic internal database connection string pointing to the postgres container
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_dev_password}@postgres:5432/${POSTGRES_DB:-amrutam_telemedicine}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-amrutam_dev_jwt_secret_at_least_32_characters_long_for_security}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "${PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Run database migrations on startup to ensure database tables are created, then start the server
    command: sh -c "npx prisma migrate deploy && node src/server.js"
    networks:
      - amrutam-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  amrutam-network:
    driver: bridge
